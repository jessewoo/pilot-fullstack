version: '3.8'

services:
  backend:
    build:
      context: ./pilot-backend
      dockerfile: Dockerfile
    container_name: wagtail-backend
    volumes:
      - ./pilot-backend:/app
      - ./sample-db/db.sqlite3:/app/db.sqlite3
      - backend-static:/app/static
      - backend-media:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=mysite.settings.dev
      - DATABASE_URL=sqlite:///db.sqlite3
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./pilot-frontend
      dockerfile: Dockerfile
    container_name: svelte-frontend
    environment:
      - NODE_ENV=production
      - PUBLIC_WAGTAIL_API_URL=http://backend:8000/api/v2
      - PUBLIC_IMAGE_DOMAIN=http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend-static:/static
      - backend-media:/media
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

volumes:
  backend-static:
  backend-media:

networks:
  app-network:
    driver: bridge
